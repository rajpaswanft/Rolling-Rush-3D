<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Restaurant Empire Tycoon</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#52b788;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:#3b2200}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.row{display:flex;gap:8px;align-items:stretch}
.pill{background:#fff8e7;border:3px solid #3b2200;border-radius:14px;box-shadow:0 4px 0 #3b2200;display:flex;align-items:center;font-weight:800}
#shop{align-self:flex-start;background:#3b2200;color:#ffd23f;border-radius:10px;padding:1px 12px;font-size:14px;font-weight:800}
#cash{background:#ffd23f;padding:0 12px;font-size:26px;min-width:70px}
#lvl{background:#4cc9f0;padding:0 10px;font-size:18px;white-space:nowrap}
#obj{flex:1;padding:3px 10px;font-size:15px;line-height:1.15}
#bar{height:16px;background:#fff8e7;border:3px solid #3b2200;border-radius:12px;overflow:hidden;box-shadow:0 4px 0 #3b2200}
#fill{height:100%;width:0;background:repeating-linear-gradient(45deg,#ef476f 0 10px,#ff7a96 10px 20px);transition:width .25s}
#carry{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));padding:2px 16px;font-size:18px;pointer-events:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));width:min(88vw,400px);text-align:center;color:#fff8e7;font-weight:800;font-size:16px;text-shadow:0 2px 0 #3b2200,0 0 8px #3b2200;pointer-events:none;transition:opacity .6s}
#jb{display:none;position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);pointer-events:none}
#jk{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
#brBtn{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));font:800 17px 'Baloo 2','Trebuchet MS',sans-serif;color:#3b2200;background:#ffd23f;border:3px solid #3b2200;border-radius:14px;box-shadow:0 4px 0 #3b2200;padding:4px 14px;z-index:6}
#brBtn.pulse{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.12)}}
#brPanel{display:none;position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));width:min(300px,86vw);background:#fff8e7;border:3px solid #3b2200;border-radius:16px;box-shadow:0 5px 0 #3b2200;padding:8px;z-index:6}
#brPanel b{display:block;text-align:center;font-size:18px;margin-bottom:4px}
.br{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;margin:4px 0;padding:6px 10px;border:3px solid #3b2200;border-radius:12px;font:800 16px 'Baloo 2','Trebuchet MS',sans-serif;color:#3b2200;background:#b7e4c7}
.br.cur{background:#ffd23f}.br.lock{background:#ccc;opacity:.7}
#lvup{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;text-align:center;background:#ffd23f;border:4px solid #3b2200;border-radius:22px;padding:8px 26px;font-size:40px;font-weight:800;box-shadow:0 8px 0 #3b2200;z-index:5;white-space:nowrap}
#lvup small{display:block;font-size:17px}
#lvup.show{animation:lvp 2.8s ease forwards}
@keyframes lvp{0%{transform:translate(-50%,-50%) scale(0);opacity:0}12%{transform:translate(-50%,-50%) scale(1.2);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.pop{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:25px;white-space:nowrap;pointer-events:none;text-shadow:-2px 0 #3b2200,2px 0 #3b2200,0 -2px #3b2200,0 3px #3b2200;animation:up .95s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-170%);opacity:0}}
</style>
</head>
<body>
<div id="hud"><div id="shop"></div><div class="row"><div id="cash" class="pill">$0</div><div id="lvl" class="pill">Level 1</div><div id="obj" class="pill"></div></div><div id="bar"><div id="fill"></div></div></div>
<div id="lvup"></div>
<div id="carry" class="pill"></div>
<div id="hint">Drag to move. Grab food at the grill and bring it to the counter. A server (you!) must stand at the counter to hand it over.</div>
<div id="jb"><div id="jk"></div></div>
<button id="brBtn">Branches</button><div id="brPanel"></div>

{const gr=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshStandardMaterial({color:0x52b788,roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.y=-.31;gr.receiveShadow=true;scene.add(gr);}

 else if(BI===1){cyl(g,.42,.42,.08,0xf4c542,0,.04,0,3);[[.15,.05],[-.1,.12],[.02,-.15]].forEach(([x,z])=>cyl(g,.07,.07,.04,0xd62828,x,.1,z,6));}
 else if(BI===2){cyl(g,.42,.42,.05,0xc8a165,0,.03,0,12);[[-.16,-.1],[.16,-.1],[0,.17]].forEach(([x,z])=>cyl(g,.15,.2,.2,0xfff4e0,x,.15,z,6));}
 else if(BI===3){[-.14,.14].forEach(z=>{cyl(g,.13,.13,.7,0xd9a441,0,.14,z,8).rotation.z=Math.PI/2;});}

 return g;}

const X0=-14,X1=14,Z0=-8,Z1=8,solids=[],pops=[];

wall(X0,Z1+.15,-9.5,Z1+.15,1);wall(-6.5,Z1+.15,-3,Z1+.15,1);wall(-.5,Z1+.15,X1+.3,Z1+.15,1);
[-9.5,-6.5,-3,-.5].forEach(x=>box(scene,.4,1.9,.4,B0.t,x,.95,Z1+.15));

decal('DINE-IN AREA',-8,-1,8.5);decal('TAKEAWAY & DRIVE-THRU',7,-.8,9.5);decal('UPGRADE OFFICE',4.8,4.3,7.5);
[[-28,-3],[-28,6],[-26,13],[-12,17],[8,17],[24,12],[26,2],[-28,-10],[-14,-21],[0,-21],[22,-21],[-30,-20]].forEach(([x,z])=>{cyl(scene,.25,.3,1.2,0x7a4b2a,x,.6,z,6);cyl(scene,0,1.2,2.4,0x2d6a4f,x,2.3,z,7);cyl(scene,0,.9,1.8,0x40916c,x,3.5,z,7);});

/* ================= stations ================= */
const S={pack:null,win:null},tables=[],workers=[],custs=[],cars=[],dtq=[];
const TP=[[-4.5,.5],[-4.5,4],[-11.5,1.5]],GI=[3.2,2.4,1.8,1.4],CS=[.9,.6,.4,.25],PI=[0,1.8,1.1,.6],HC=[1,2,4,6],CAPS=[1,3,6,10];
const PRICE=Math.round(20*M),TIP=Math.round(PRICE*.75);
function makeCounter(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,3,1,1.2,0x8d5524,0,.5,0);box(g,3.2,.12,1.4,0xf2e3c6,0,1.06,0);box(g,.5,.35,.4,0x333333,1.1,1.3,-.2);
 [-1.4,1.4].forEach(px=>box(g,.1,1.6,.1,0xdddddd,px,1.9,.55));for(let i=0;i<6;i++)box(g,.53,.18,1.3,i&1?B0.c:0xffffff,-1.33+i*.53,2.75,.6);
 const sg=new THREE.Group();sg.position.set(-.6,1.12,0);g.add(sg);solid(x,z,3.2,1.4);return{x,z,g,sg,shelf:0,q:[],sv:0,stock:{k:0}};}
const CT=makeCounter(-8,-6.6);{const l=label();l.position.set(-8,3.9,-6.6);scene.add(l);l.draw('COUNTER','serve here');}
const G0={x:0,z:-6.6,px:0,pz:-4.7,stock:3,t:0};
{const g=new THREE.Group();g.position.set(G0.x,0,G0.z);scene.add(g);box(g,2.2,1,1.6,B0.g,0,.5,0);box(g,1.9,.12,1.3,0x22223b,0,1.06,0);[-.55,0,.55].forEach(px=>glow(g,.14,.06,1,0xff6b35,px,1.14,0));cyl(g,.18,.18,.9,0x9a8c98,.8,1.55,-.5,8);
 cyl(g,.6,.6,.08,0xe5e5e5,0,.04,2,16);G0.tray=new THREE.Group();G0.tray.position.set(0,.08,2);g.add(G0.tray);solid(G0.x,G0.z,2.2,1.6);ring(G0.px,G0.pz,0xffd23f);st(G0.tray,3,'b');

{const g=new THREE.Group();g.position.set(trash.x,0,trash.z);scene.add(g);cyl(g,.5,.4,1,0x6c757d,0,.5,0,10);trash.lid=cyl(g,.56,.56,.12,0x495057,0,1.06,0,10);solid(trash.x,trash.z,1,1);ring(trash.x,trash.z,0xff595e);}

 cyl(plates,.3,.3,.05,0xffffff,-.2,0,.1,10);cyl(plates,.3,.3,.05,0xffffff,.25,0,-.2,10);cyl(plates,.12,.12,.06,0xd62828,-.2,.05,.1,6);plates.visible=false;

function makePack(a){const x=6,z=-6.6,g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,2.6,1,1.4,0x9c6b3a,0,.5,0);box(g,2.4,.1,1.2,0xf2e3c6,0,1.05,0);
 const gin=new THREE.Group(),gout=new THREE.Group();gin.position.set(-.7,1.1,0);gout.position.set(.7,1.1,0);g.add(gin,gout);

 S.pack={x,z,px:x,pz:z+2.1,inb:0,out:0,prog:0,gin,gout,bar};if(a)pop(g);}

 const c=makeCounter(11.5,-7.3);c.px=11.5;c.pz=-5.1;ring(c.px,c.pz,0xffa62b);if(a)pop(c.g);const l=label();l.position.set(11.5,4,-7.3);scene.add(l);l.draw('CAR WINDOW','bags only');S.win=c;}

  pk.bar.scale.x=Math.max(.001,pk.prog/iv);}
 // cash pad, tables
 if(pile>=1&&dist(p.x,p.z,cashPad.x,cashPad.z)<1.4){const c=Math.floor(pile);pile-=c;earn(c);popText(new THREE.Vector3(cashPad.x,2,cashPad.z),'+$'+c,'#ffd23f');refreshPile();beep(880,.1,.05);beep(1180,.12,.04);}
 care(p.x,p.z,dt,true);
 // pads
 for(let i=pads.length-1;i>=0;i--){const q=pads[i];
  if(cash>=.01&&q.paid<q.cost&&dist(p.x,p.z,q.x,q.z)<1.45){const a=Math.min(cash,q.cost/1.2*dt,q.cost-q.paid);cash-=a;q.paid+=a;hud();}
  const f=Math.max(.001,q.paid/q.cost);q.f.scale.set(f,1,f);drawPad(q);
  if(q.paid>=q.cost-.001){pads.splice(i,1);scene.remove(q.g);T[q.k]=tier(q.k)+1;ensure(true);refreshPads();banner('LEVEL UP!','Level '+lvOf()+': '+q.name);popText(new THREE.Vector3(q.x,2,q.z),q.name+'!','#ffffff');checkMax();save();hud();}}
 // customers, counter, cars, workers
 spawnT+=dt;if(spawnT>=Math.max(1.8,4-lvOf()*.09)){spawnT=0;spawnCust();}
 updCounter(dt);for(let i=custs.length-1;i>=0;i--){updCust(custs[i],dt);if(custs[i].dead)custs.splice(i,1);}
 carsUpd(dt);workers.forEach(w=>updWorker(w,dt));
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.t+=dt;if(q.t<=0)continue;const kk=Math.min(q.t/.4,1),c3=2.70158,e=1+c3*Math.pow(kk-1,3)+1.70158*Math.pow(kk-1,2);q.o.scale.setScalar(Math.max(.001,e));if(kk>=1){q.o.scale.setScalar(1);pops.splice(i,1);}}
 // camera: whole layout stays visible; follows the player more on narrow screens
 const ck=1-Math.exp(-dt*4);camT.x+=(p.x*follow-camT.x)*ck;camT.z+=(p.z*follow-camT.z)*ck;cam.position.copy(camT).add(camOff);cam.lookAt(camT);}
function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05));renderer.render(scene,cam);}

/* ================= boot ================= */
refreshPile();addTable(TP[0],false);ensure(false);refreshPads();buildPanel();checkMax();syncCarry();hud();
if(SV.mx>BI||tier('grill')+tier('counter')>0)$('hint').style.opacity=0;
setTimeout(()=>{$('hint').style.opacity=0;},12000);
cam.position.copy(camT).add(camOff);cam.lookAt(camT);cam.updateMatrixWorld();
loop();
})();
